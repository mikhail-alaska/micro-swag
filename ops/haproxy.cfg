global
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 2s
    timeout client 10m
    timeout server 10m

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend amqp
    bind *:5672
    default_backend rabbits

backend rabbits
    balance roundrobin
    option tcp-check
    option redispatch
    retries 3
    default-server inter 1s fall 1 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server rabbit1 rabbit1:5672 check
    server rabbit2 rabbit2:5672 check
    server rabbit3 rabbit3:5672 check

frontend management1
    bind *:15672
    default_backend management1

backend management1
    server rabbit1 rabbit1:15672 check

frontend management2
    bind *:15673
    default_backend management2

backend management2
    server rabbit2 rabbit2:15672 check

frontend management3
    bind *:15674
    default_backend management3

backend management3
    server rabbit3 rabbit3:15672 check
